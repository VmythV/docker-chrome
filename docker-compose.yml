services:
  chrome:
    platform: linux/amd64
    image: playwright-chrome:latest
    build:
      context: .
      args:
        VNC_PASSWORD: "${VNC_PASSWORD:-}"
    container_name: playwright-chrome
    hostname: playwright-chrome # 重建容器后保持 Chrome 进程锁中的主机名稳定
    shm_size: "2gb"
    ports:
      - "9222:9223"   # socat 转发到容器内 Chrome 的 127.0.0.1:9222
      - "127.0.0.1:9224:9224"   # 文件接口：只发布到本机，带令牌
      - "6080:6080"   # noVNC 网页版：http://localhost:6080/vnc.html
      - "5900:5900"   # 原生 VNC 客户端连接用，不需要可以删掉
    environment:
      SCREEN_WIDTH: "1920"
      SCREEN_HEIGHT: "1080"
      SCREEN_DEPTH: "24"
      # EXTRA_CHROME_FLAGS: "--lang=zh-CN"
      # 文件接口的令牌。留空时不启动文件接口（Chrome 与 VNC 不受影响）。
      FILE_API_TOKEN: "${FILE_API_TOKEN:-}"
    volumes:
      - chrome-profile:/data/chrome-profile
    restart: unless-stopped

volumes:
  chrome-profile:
